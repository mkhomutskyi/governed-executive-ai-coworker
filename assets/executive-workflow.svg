<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1485" viewBox="0 0 1600 990" role="img" aria-labelledby="title desc"><title id="title">Monday executive brief: the workflow</title><desc id="desc">Sales, finance and marketing data are aligned to one row per week and region. Governed metrics feed the brief skill directly, followed by selected checks and human review. Genie follow-up questions are optional.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="1600" height="990" fill="#f7f7f5"/><text x="70" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="49" font-weight="700" text-anchor="start" fill="#111827">Monday executive brief: the workflow</text><text x="70" y="139" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#4b5563">Align the data. Draft from governed metrics. Review before decisions.</text><rect x="70" y="184" width="440" height="104" rx="22" fill="#ffffff" stroke="#d1d5db" /><text x="290" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#111827">Sales</text><text x="290" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#4b5563">Week × region × segment</text><path d="M290 288 V316 H800 V347" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="580" y="184" width="440" height="104" rx="22" fill="#ffffff" stroke="#d1d5db" /><text x="800" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#111827">Finance</text><text x="800" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#4b5563">Week × region</text><path d="M800 288 V316 H800 V347" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="1090" y="184" width="440" height="104" rx="22" fill="#ffffff" stroke="#d1d5db" /><text x="1310" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#111827">Marketing</text><text x="1310" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#4b5563">Week × region × channel</text><path d="M1310 288 V316 H800 V347" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="430" y="360" width="740" height="99" rx="22" fill="#ffffff" stroke="#d1d5db" /><text x="800" y="403" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#111827">Align to week + region</text><text x="800" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#4b5563">One row per week and region</text><path d="M800 459 V491 H237 V524" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="70" y="540" width="320" height="185" rx="22" fill="#ffffff" stroke="#d1d5db" /><text x="96" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#2563eb">01</text><text x="96" y="629" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#111827">Governed metrics</text><text x="96" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#4b5563">Approved measures</text><text x="96" y="706" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#4b5563">and ratios</text><rect x="450" y="540" width="320" height="185" rx="22" fill="#111827" stroke="#111827" /><text x="476" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#60a5fa">02</text><text x="476" y="629" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#ffffff">Brief skill</text><text x="476" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#cbd5e1">Queries the metric view</text><text x="476" y="706" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#cbd5e1">Drafts the Monday brief</text><rect x="830" y="540" width="320" height="185" rx="22" fill="#ffffff" stroke="#d1d5db" /><text x="856" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#2563eb">03</text><text x="856" y="629" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#111827">Selected checks</text><text x="856" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#4b5563">12 KPI rows</text><text x="856" y="706" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#4b5563">Selected values + format</text><rect x="1210" y="540" width="320" height="185" rx="22" fill="#111827" stroke="#111827" /><text x="1236" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#60a5fa">04</text><text x="1236" y="629" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#ffffff">Human review</text><text x="1236" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#cbd5e1">Narrative + calculations</text><text x="1236" y="706" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#cbd5e1">Approve proposed actions</text><path d="M396 633 H440" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)" /><path d="M776 633 H820" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)" /><path d="M1156 633 H1200" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)" /><path d="M230 725 V798" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="8 8"/><rect x="70" y="814" width="320" height="113" rx="22" fill="#edf4fc" stroke="#bfd2ea" /><text x="230" y="860" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#1e40af">Optional Genie</text><text x="230" y="899" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#4b5563">Follow-up questions</text><rect x="450" y="814" width="1080" height="113" rx="22" fill="#ffffff" stroke="#d1d5db" /><text x="482" y="860" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#111827">Checks support the review. People make the decisions.</text><text x="482" y="900" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#4b5563">Genie is optional in this build; actions require human approval.</text><text x="70" y="970" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#6b7280">Illustrative workflow from the synthetic-data experiment.</text></svg>